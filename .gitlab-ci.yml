stages:
  - test
  - build
  - deploy

default:
  tags:
    - app-primary
  cache:
    # Keyed on the lockfiles: a dependency change invalidates it, an ordinary
    # commit reuses it.
    key:
      files:
        - package-lock.json
        - server/package-lock.json
    paths:
      - node_modules/
      - server/node_modules/

.node: &node
  variables:
    # mise refuses an untrusted mise.toml, and the checkout is new every job.
    MISE_TRUSTED_CONFIG_PATHS: $CI_PROJECT_DIR
    MISE_YES: "1"
  before_script:
    # Node comes from mise.toml (26.12.1, the same version as the API image),
    # not from the runner's own Node: this is a shell runner, and the host's
    # apt Node is whatever it was given first. mise and its Node live in the
    # gitlab-runner home, so only the first job downloads anything.
    #
    # The setup runs under a flock because jobs of one stage run side by side
    # and apt and the mise installer must not run twice at once. libatomic1 is
    # there because nodejs.org's Linux build, which mise installs, needs
    # libatomic.so.1, and a Debian host that only had the apt nodejs may lack it.
    - export PATH="$HOME/.local/bin:$PATH"
    - mkdir -p "$HOME/.local/bin"
    - |
      flock "$HOME/.local/bin/.mise-install.lock" bash -eo pipefail -c '
        missing=""
        command -v curl >/dev/null 2>&1 || missing="$missing ca-certificates curl"
        dpkg -s libatomic1 >/dev/null 2>&1 || missing="$missing libatomic1"
        if [ -n "$missing" ]; then
          sudo apt-get update
          sudo apt-get install -y $missing
        fi
        command -v mise >/dev/null 2>&1 || curl -fsSL https://mise.run | MISE_VERSION=v2026.10.25 sh
      '
    - mise install
    - mise exec -- node --version
    - mise exec -- npm --version

test:app:
  <<: *node
  stage: test
  only:
    - main
    - merge_requests
  script:
    - mise exec -- npm ci
    - mise exec -- npm run lint
    - mise exec -- npm test

test:api:
  <<: *node
  stage: test
  only:
    - main
    - merge_requests
  script:
    - cd server
    - mise exec -- npm ci
    - mise exec -- npm run typecheck
    - mise exec -- npm test

# Dependency gate; deploy waits for it. audit-ci runs `npm audit` over
# package-lock.json and server/package-lock.json, and fails on any high or critical
# advisory in a production dependency that audit-ci.jsonc does not allowlist;
# dev dependencies are skipped. It reads the lockfiles and asks the registry,
# so it installs nothing of ours and builds nothing, and the checkout is
# mounted read-only.
test:audit:
  stage: test
  tags:
    - app-primary
  cache: []
  only:
    - main
    - merge_requests
  script:
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/app:ro -w /app node:26.12.1-alpine sh -ec '
        npx --yes audit-ci@7.1.0 --config audit-ci.jsonc
        npx --yes audit-ci@7.1.0 --config audit-ci.jsonc --directory server
      '

build:
  <<: *node
  stage: build
  only:
    - main
  needs:
    - test:app
  script:
    - mise exec -- npm ci
    - mise exec -- npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  only:
    - main
  needs:
    - job: build
      artifacts: true
    - job: test:api
    - job: test:audit
  script:
    # Unique tag per pipeline so Swarm always sees a new image reference and
    # redeploys, even when only a CI/CD variable changed and the commit didn't.
    - export TAG="$CI_PIPELINE_ID"

    # The API's whole environment file arrives as one CI/CD variable and is
    # written where the compose file mounts it. It is not baked into the
    # image, so the image holds no secrets and a variable change needs no
    # rebuild, only a redeploy.
    - test -n "$PROD_ENV" || (echo "PROD_ENV is not set - see the note at the end of this file" && exit 1)
    - sudo mkdir -p /opt/pdf-editor/dist
    - printf '%s\n' "$PROD_ENV" | sudo tee /opt/pdf-editor/api.env >/dev/null
    - sudo chmod 600 /opt/pdf-editor/api.env

    # Static app.
    - sudo cp -a dist/. /opt/pdf-editor/dist/
    - sudo cp nginx/default.conf /opt/pdf-editor/nginx.conf

    # The API image is built here because the service is pinned to this node.
    - docker build -t pdf-editor-api:$TAG server/
    - API_IMAGE_TAG=$TAG docker stack deploy --resolve-image never -c docker-compose.yml pdf-editor

    - sudo cp pdf-editor.conf /opt/stacks/proxy/conf.d/
    - docker exec $(docker ps -q -f name=proxy_nginx) nginx -t
    - docker exec $(docker ps -q -f name=proxy_nginx) nginx -s reload

    # Drop older images to stop the host filling up.
    - docker images "pdf-editor-api" --format '{{.Repository}}:{{.Tag}}' | grep -v ":$TAG$" | xargs -r docker rmi -f || true

# Required CI/CD variables (Settings > CI/CD > Variables):
#
#   PROD_ENV   protected   The API's full environment file. Start from
#                          server/api.env.example. Must set:
#
#                            DB_HOST=proxysql
#                            DB_PORT=6033
#                            DB_NAME=pdf_editor
#                            DB_USERNAME, DB_PASSWORD
#                            APP_ORIGIN=https://pdf-editor.eightmile.co.uk
#                            SECURE_COOKIES=true
#                            TRUST_PROXY_HOPS=2
#                            MAIL_TRANSPORT=smtp
#                            SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS
#                            MAIL_FROM=Eight Mile PDF <no-reply@eightmile.co.uk>
#
#                          APP_ORIGIN must be the exact origin the editor is
#                          served from, or the API refuses every write with 403.
#
#                          GitLab cannot mask a multi-line value, so mark it
#                          Protected rather than Masked.
#
# The database itself is not created by the pipeline. Once, on the MySQL
# server behind proxysql:
#
#   CREATE DATABASE pdf_editor CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
#   CREATE USER 'pdf_editor'@'%' IDENTIFIED BY '<password>';
#   GRANT ALL ON pdf_editor.* TO 'pdf_editor'@'%';
#
# The API creates its own tables on first start, so the user needs DDL rights.
# proxysql only forwards for users it knows, so the same user also has to be
# added to its mysql_users table (LOAD MYSQL USERS TO RUNTIME; SAVE MYSQL USERS
# TO DISK), or every connection is refused.
#
# Changing it and re-running the pipeline is enough to redeploy: the
# per-pipeline TAG guarantees Swarm notices. The file lands at
# /opt/pdf-editor/api.env on the manager, mode 600, and is never committed.

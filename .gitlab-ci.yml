stages:
  - test
  - build
  - deploy

default:
  tags:
    - app-primary
  cache:
    # Keyed on the lockfiles: a dependency change invalidates it, an ordinary
    # commit reuses it.
    key:
      files:
        - package-lock.json
        - server/package-lock.json
    paths:
      - node_modules/
      - server/node_modules/

.node: &node
  before_script:
    - |
      if ! command -v npm >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl
        curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
        sudo apt-get install -y nodejs
      fi
    - node --version
    - npm --version

test:app:
  <<: *node
  stage: test
  only:
    - main
    - merge_requests
  script:
    - npm ci
    - npm run lint
    - npm test

test:api:
  <<: *node
  stage: test
  only:
    - main
    - merge_requests
  script:
    - cd server
    - npm ci
    - npm run typecheck
    - npm test

build:
  <<: *node
  stage: build
  only:
    - main
  needs:
    - test:app
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  only:
    - main
  needs:
    - job: build
      artifacts: true
    - job: test:api
  script:
    # Unique tag per pipeline so Swarm always sees a new image reference and
    # redeploys, even when only a CI/CD variable changed and the commit didn't.
    - export TAG="$CI_PIPELINE_ID"

    # The API's whole environment file arrives as one CI/CD variable and is
    # written where the compose file mounts it. It is not baked into the
    # image, so the image holds no secrets and a variable change needs no
    # rebuild, only a redeploy.
    - test -n "$PROD_ENV" || (echo "PROD_ENV is not set - see the note at the end of this file" && exit 1)
    - sudo mkdir -p /opt/pdf-editor/dist /opt/pdf-editor/data
    - printf '%s\n' "$PROD_ENV" | sudo tee /opt/pdf-editor/api.env >/dev/null
    - sudo chmod 600 /opt/pdf-editor/api.env

    # Static app.
    - sudo cp -a dist/. /opt/pdf-editor/dist/
    - sudo cp nginx/default.conf /opt/pdf-editor/nginx.conf

    # The API image is built here because the service is pinned to this node.
    - docker build -t pdf-editor-api:$TAG server/
    - sudo chown -R 1000:1000 /opt/pdf-editor/data
    - API_IMAGE_TAG=$TAG docker stack deploy --resolve-image never -c docker-compose.yml pdf-editor

    - sudo cp pdf-editor.conf /opt/stacks/proxy/conf.d/
    - docker exec $(docker ps -q -f name=proxy_nginx) nginx -t
    - docker exec $(docker ps -q -f name=proxy_nginx) nginx -s reload

    # Drop older images to stop the host filling up.
    - docker images "pdf-editor-api" --format '{{.Repository}}:{{.Tag}}' | grep -v ":$TAG$" | xargs -r docker rmi -f || true

# Required CI/CD variables (Settings > CI/CD > Variables):
#
#   PROD_ENV   protected   The API's full environment file. Start from
#                          server/api.env.example. Must set:
#
#                            DATABASE_PATH=/data/app.db
#                            APP_ORIGIN=https://pdf-editor.eightmile.co.uk
#                            SECURE_COOKIES=true
#                            TRUST_PROXY_HOPS=2
#                            MAIL_TRANSPORT=smtp
#                            SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS
#                            MAIL_FROM=Eight Mile PDF <no-reply@eightmile.co.uk>
#
#                          APP_ORIGIN must be the exact origin the editor is
#                          served from, or the API refuses every write with 403.
#
#                          GitLab cannot mask a multi-line value, so mark it
#                          Protected rather than Masked.
#
# Changing it and re-running the pipeline is enough to redeploy: the
# per-pipeline TAG guarantees Swarm notices. The file lands at
# /opt/pdf-editor/api.env on the manager, mode 600, and is never committed.

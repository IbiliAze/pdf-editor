# PDF editor: a static React build served by nginx, plus a small account API.
# Both are reached only through the reverse proxy on the shared overlay
# (monitoring-network); neither publishes host ports.
#
# Deploy on the manager:
#   docker build -t pdf-editor-api:latest server/
#   API_IMAGE_TAG=latest docker stack deploy -c docker-compose.yml pdf-editor
#
# Then install the nginx site (see README.md):
#   sudo cp pdf-editor.conf /opt/stacks/proxy/conf.d/
#   docker exec $(docker ps -q -f name=proxy_nginx) nginx -t && \
#   docker exec $(docker ps -q -f name=proxy_nginx) nginx -s reload

services:
  pdf-editor:
    image: nginx:1.27-alpine
    volumes:
      - /opt/pdf-editor/dist:/usr/share/nginx/html:ro
      - /opt/pdf-editor/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          # The built app is a bind mount on the manager's filesystem.
          - node.role == manager

  pdf-editor-api:
    # Built on the manager by CI and tagged with the commit, so a redeploy of
    # the same stack actually restarts the service.
    image: pdf-editor-api:${API_IMAGE_TAG:-latest}
    env_file:
      - /opt/pdf-editor/api.env
    volumes:
      # SQLite database. Back this directory up.
      - /opt/pdf-editor/data:/data
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          # SQLite and the image are both local to the manager.
          - node.role == manager
      restart_policy:
        condition: any

networks:
  # Created by the swarm/monitoring setup; shared with the reverse proxy so it
  # can reach these services by name (pdf-editor:80, pdf-editor-api:3000).
  monitoring-network:
    external: true

# nginx inside the app container. It serves the built SPA and forwards /api to
# the account service on the same overlay network.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset file names are safe to cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /fonts/ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://pdf-editor-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
  }

  # /verify and /reset are app routes reached from links in emails, so every
  # unknown path falls back to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}

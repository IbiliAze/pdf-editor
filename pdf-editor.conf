# PDF editor site for the reverse proxy.
# Install: copy to /opt/stacks/proxy/conf.d/ on the manager, then reload nginx.
# TLS terminates here on the shared wildcard cert; the app container runs plain HTTP.
server {
  listen 443 ssl;
  server_name pdf-editor.eightmile.co.uk;

  ssl_certificate     /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    set $upstream pdf-editor:80;
    proxy_pass http://$upstream;
  }
}

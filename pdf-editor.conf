# PDF editor site for the reverse proxy.
# Install: copy to /opt/stacks/proxy/conf.d/ on the manager, then reload nginx.
# TLS terminates here on the shared wildcard cert; the app container runs plain HTTP.
server {
  listen 443 ssl;
  server_name pdf-editor.eightmile.co.uk;

  ssl_certificate     /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # PDFs are edited in the browser, but account requests carry a JSON body.
  client_max_body_size 1m;

  location / {
    set $upstream pdf-editor:80;
    proxy_pass http://$upstream;
    proxy_http_version 1.1;
    # The API rate limits per client address, which only works if the real one
    # survives both proxy hops.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
